<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Primer Nombre <span class="text-[#C41230]">*</span></label>
    <input type="text" id="{{ idp }}primer_nombre" name="{{ p }}primer_nombre" {{ req }} maxlength="50" placeholder="Ej: Patricia"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Segundo Nombre</label>
    <input type="text" id="{{ idp }}segundo_nombre" name="{{ p }}segundo_nombre" maxlength="50" placeholder="Opcional"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Apellido Paterno <span class="text-[#C41230]">*</span></label>
    <input type="text" id="{{ idp }}apellido_paterno" name="{{ p }}apellido_paterno" {{ req }} maxlength="50" placeholder="Ej: Morales"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Apellido Materno</label>
    <input type="text" id="{{ idp }}apellido_materno" name="{{ p }}apellido_materno" maxlength="50" placeholder="Ej: Castro"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">RUT <span class="text-[#C41230]">*</span></label>
    <input type="text" id="{{ idp }}rut" name="{{ p }}rut" {{ req }} data-rut="true" maxlength="12" placeholder="Ej: 12.345.678-5"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none font-mono" />
    <div id="{{ idp }}rut_feedback" class="rut-feedback"></div>
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Teléfono</label>
    <input type="text" id="{{ idp }}telefono" name="{{ p }}telefono" maxlength="15" placeholder="+56 9 8765 4321"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none font-mono" />
    <div class="tel-feedback"></div>
  </div>
  <div class="sm:col-span-2">
    <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico <span class="text-[#C41230]">*</span> <span class="text-slate-400 font-normal">(para cuenta Portal Ciudadano)</span></label>
    <input type="email" id="{{ idp }}correo" name="{{ p }}correo" {{ req }} maxlength="100" placeholder="vecino@correo.cl (se enviará clave provisional)"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
  </div>
  <div class="sm:col-span-2">
    <label class="block text-xs font-bold text-slate-700 mb-1">Dirección</label>
    <input type="text" id="{{ idp }}direccion" name="{{ p }}direccion" maxlength="200" placeholder="Calle, pasaje y número (máx 200 caracteres)"
           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
  </div>

  <!-- Delegación Territorial Asignada -->
  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Delegación Territorial</label>
    <input type="text" readonly
           value="{% if delegacion_activa %}{{ delegacion_activa.nombre }}{% elif delegacion_seleccionada %}{{ delegacion_seleccionada.nombre }}{% else %}Seleccione una delegación activa en la cabecera{% endif %}"
           class="w-full px-4 py-2 rounded-full border border-slate-200 bg-slate-100 text-xs font-bold text-slate-800 focus:outline-none select-none" />
    {% if incluir_delegacion_hidden %}
      <input type="hidden" name="delegacion_id" value="{% if delegacion_activa %}{{ delegacion_activa.id }}{% endif %}">
    {% endif %}
  </div>

  <div>
    <label class="block text-xs font-bold text-slate-700 mb-1">Sector / Territorio <span class="text-[#C41230]">*</span></label>
    <select id="{{ idp }}sector_id" name="{{ p }}sector_id" {{ req }} class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none font-bold">
      <option value="">Seleccione un sector / territorio...</option>
      {% for s in sectores %}
        <option value="{{ s.id }}">{{ s.nombre }}{% if es_admin and not delegacion_activa %} ({{ s.delegacion.nombre }}){% endif %}</option>
      {% endfor %}
    </select>
  </div>

  <div class="sm:col-span-2">
    <label class="block text-xs font-bold text-slate-700 mb-1">Estado</label>
    <select id="{{ idp }}estado" name="{{ p }}estado" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs bg-white focus:ring-2 focus:ring-[#C41230] focus:outline-none font-bold">
      <option value="Activo">Activo</option>
      <option value="Inactivo">Inactivo</option>
    </select>
  </div>
</div>
