<!-- Directiva estructurada (3 columnas por representante con búsqueda en Vecinos) -->
<div class="sm:col-span-3 p-3.5 rounded-2xl bg-slate-50/90 border border-slate-200 space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-extrabold text-slate-800 border-b border-slate-200 pb-1.5">
    <div class="flex items-center gap-2">
      <i data-lucide="users" class="w-4 h-4 text-[#C41230]"></i>
      <span>Directiva de la Organización (Presidente, Tesorero y Secretario)</span>
    </div>
    <span class="text-[10px] font-medium text-slate-500">Busca en Vecinos o ingresa los datos manualmente para registrarlo</span>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <!-- Presidente -->
    <div data-rep-card class="bg-white p-3 rounded-xl border border-slate-200 space-y-2.5">
      <div class="text-[11px] font-extrabold uppercase tracking-wider text-[#C41230] border-b border-slate-100 pb-1">Presidente</div>
      <div class="space-y-1">
        <label class="block text-[10px] font-bold text-slate-500">Buscar en Vecinos</label>
        <input type="text" list="vecinos-directiva-list" autocomplete="off"
               oninput="sincronizarVecinoDirectiva(this)" onchange="sincronizarVecinoDirectiva(this)"
               placeholder="Buscar por nombre o RUT..."
               class="w-full px-3 py-1.5 rounded-xl border border-slate-300 bg-slate-50 text-[11px] focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <label class="block text-[11px] font-bold text-slate-700">Primer Nombre</label>
          <input type="text" id="{{ idp }}pres-pn" name="{{ p }}presidente_primer_nombre" data-rep-field="primer_nombre" maxlength="50" placeholder="Primer nombre"
                 class="w-full px-2.5 py-1.5 rounded-xl border border-slate-300 bg-white text-xs focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
        </div>
        <div class="space-y-1">
          <label class="block text-[11px] font-bold text-slate-700">Apellido Paterno</label>
          <input type="text" id="{{ idp }}pres-ap" name="{{ p }}presidente_apellido_paterno" data-rep-field="apellido_paterno" maxlength="50" placeholder="Apellido paterno"
                 class="w-full px-2.5 py-1.5 rounded-xl border border-slate-300 bg-white text-xs focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-[11px] font-bold text-slate-700">RUT</label>
        <input type="text" id="{{ idp }}pres-rut" name="{{ p }}presidente_rut" data-rep-field="rut" data-rut="true" maxlength="12" placeholder="12.345.678-5"
               class="w-full px-3 py-1.5 rounded-xl border border-slate-300 bg-white text-xs font-mono focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
        <div class="rut-feedback"></div>
      </div>
      <div class="space-y-1">
        <label class="block text-[11px] font-bold text-slate-700">Teléfono</label>
        <input type="text" id="{{ idp }}pres-tel" name="{{ p }}presidente_telefono" data-rep-field="telefono" maxlength="15" placeholder="+56 9 8765 4321"
               class="w-full px-3 py-1.5 rounded-xl border border-slate-300 bg-white text-xs font-mono focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
        <div class="tel-feedback"></div>
      </div>
      <div class="space-y-1">
        <label class="block text-[11px] font-bold text-slate-700">Correo Electrónico</label>
        <input type="email" id="{{ idp }}pres-correo" name="{{ p }}presidente_correo" data-rep-field="correo" maxlength="100" placeholder="presidente@correo.cl"
               class="w-full px-3 py-1.5 rounded-xl border border-slate-300 bg-white text-xs focus:ring-2 focus:ring-[#C41230] focus:outline-none" />
      </div>
    </div>

{% if include_datalist %}
<datalist id="vecinos-directiva-list">
  {% for vd in vecinos_directiva %}
    <option value="{{ vd.nombre_corto }}"
            data-id="{{ vd.id }}"
            data-primer-nombre="{{ vd.primer_nombre }}"
            data-apellido-paterno="{{ vd.apellido_paterno }}"
            data-rut="{{ vd.rut }}"
            data-telefono="{{ vd.telefono }}"
            data-correo="{{ vd.email }}"
            data-search="{{ vd.nombre_corto }} {{ vd.nombre }} {{ vd.rut }} {{ vd.telefono }} {{ vd.email }}">RUT: {{ vd.rut }}{% if vd.telefono %} · {{ vd.telefono }}{% endif %}{% if vd.email %} · {{ vd.email }}{% endif %}</option>
  {% endfor %}
</datalist>
<script>
  window.sincronizarVecinoDirectiva = function(inp) {
    if (!inp) return;
    const dl = document.getElementById('vecinos-directiva-list');
    const card = inp.closest('[data-rep-card]');
    if (!dl || !card) return;
    const val = (inp.value || '').trim();
    if (!val) return;
    let matched = null;
    for (const opt of dl.querySelectorAll('option')) {
      if (opt.value === val) {
        matched = opt;
        break;
      }
    }
    if (!matched) return;
    const setField = (fieldName, value) => {
      const el = card.querySelector(`[data-rep-field="${fieldName}"]`);
      if (el) {
        el.value = value || '';
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
    };
    setField('primer_nombre', matched.dataset.primerNombre);
    setField('apellido_paterno', matched.dataset.apellidoPaterno);
    setField('rut', matched.dataset.rut);
    setField('telefono', matched.dataset.telefono);
    setField('correo', matched.dataset.correo);
  };
</script>
{% endif %}
