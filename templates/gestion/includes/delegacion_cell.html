{% if nombre %}
  <span class="inline-flex items-center gap-1 font-bold text-[#C41230] text-[11px] leading-snug">
    <i data-lucide="map-pin" class="w-3 h-3 text-[#C41230] shrink-0"></i>
    <span>{{ nombre }}</span>
  </span>
{% else %}
  <span class="text-slate-400 italic text-[11px] block">{{ fallback|default:"Sin delegación" }}</span>
{% endif %}
{% if sub %}
  <span class="text-slate-500 text-[11px] block leading-snug">{{ sub }}</span>
{% endif %}
